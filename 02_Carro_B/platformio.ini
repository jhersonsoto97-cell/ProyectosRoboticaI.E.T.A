; Configuracion del proyecto para PlatformIO.
; Abra esta carpeta en VS Code y use: PlatformIO: Build o PlatformIO: Upload.

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino

; Velocidad del Monitor Serie para los mensajes de diagnostico del programa.
monitor_speed = 115200

; El HC-05 se conecta a Serial1 y usa 9600 baudios por defecto.
; No se requieren librerias externas para este proyecto.
